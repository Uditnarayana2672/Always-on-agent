<title>Always-On Agent Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;600&display=swap">
<style>
/* Layout: enterprise shell. Dark 48px header across the top, white side nav with a blue selected rail, square tiles on a white page. */
:root {
  --bg: #ffffff; --layer: #f4f4f4; --layer2: #ffffff; --accent-layer: #e0e0e0; --hover: #e8e8e8;
  --line: #e0e0e0; --line-strong: #8d8d8d; --track: #c6c6c6;
  --fg: #161616; --muted: #525252; --placeholder: #6f6f6f;
  --link: #0f62fe; --interactive: #0f62fe; --interactive-hover: #0353e9; --on-interactive: #ffffff; --focus: #0f62fe;
  --shell: #161616; --shell-fg: #f4f4f4; --shell-muted: #c6c6c6; --shell-line: #393939;
  --nav-bg: #ffffff; --nav-selected: #e0e0e0;
  --t-gray-bg: #e0e0e0; --t-gray-fg: #161616;
  --t-blue-bg: #d0e2ff; --t-blue-fg: #0043ce;
  --t-orange-bg: #ffd9be; --t-orange-fg: #8a3800;
  --t-red-bg: #ffd7d9; --t-red-fg: #a2191f;
  --t-green-bg: #a7f0ba; --t-green-fg: #0e6027;
  --t-teal-bg: #9ef0f0; --t-teal-fg: #005d5d;
  --success: #24a148; --error: #da1e28; --warning: #f1c21b; --warning-text: #8e6a00; --info: #0043ce;
  --notice-warn-bg: #fcf4d6; --toast-bg: #393939; --toast-fg: #f4f4f4;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", Menlo, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161616; --layer: #262626; --layer2: #393939; --accent-layer: #393939; --hover: #333333;
  --line: #393939; --line-strong: #6f6f6f; --track: #525252;
  --fg: #f4f4f4; --muted: #c6c6c6; --placeholder: #a8a8a8;
  --link: #78a9ff; --interactive: #0f62fe; --interactive-hover: #0353e9; --on-interactive: #ffffff; --focus: #ffffff;
  --shell: #161616; --shell-fg: #f4f4f4; --shell-muted: #c6c6c6; --shell-line: #393939;
  --nav-bg: #161616; --nav-selected: #393939;
  --t-gray-bg: #525252; --t-gray-fg: #e0e0e0;
  --t-blue-bg: #0043ce; --t-blue-fg: #d0e2ff;
  --t-orange-bg: #8a3800; --t-orange-fg: #ffd9be;
  --t-red-bg: #a2191f; --t-red-fg: #ffd7d9;
  --t-green-bg: #0e6027; --t-green-fg: #a7f0ba;
  --t-teal-bg: #005d5d; --t-teal-fg: #9ef0f0;
  --success: #42be65; --error: #fa4d56; --warning: #f1c21b; --warning-text: #f1c21b; --info: #4589ff;
  --notice-warn-bg: #393939; --toast-bg: #f4f4f4; --toast-fg: #161616;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #161616; --layer: #262626; --layer2: #393939; --accent-layer: #393939; --hover: #333333;
  --line: #393939; --line-strong: #6f6f6f; --track: #525252;
  --fg: #f4f4f4; --muted: #c6c6c6; --placeholder: #a8a8a8;
  --link: #78a9ff; --interactive: #0f62fe; --interactive-hover: #0353e9; --on-interactive: #ffffff; --focus: #ffffff;
  --shell: #161616; --shell-fg: #f4f4f4; --shell-muted: #c6c6c6; --shell-line: #393939;
  --nav-bg: #161616; --nav-selected: #393939;
  --t-gray-bg: #525252; --t-gray-fg: #e0e0e0;
  --t-blue-bg: #0043ce; --t-blue-fg: #d0e2ff;
  --t-orange-bg: #8a3800; --t-orange-fg: #ffd9be;
  --t-red-bg: #a2191f; --t-red-fg: #ffd7d9;
  --t-green-bg: #0e6027; --t-green-fg: #a7f0ba;
  --t-teal-bg: #005d5d; --t-teal-fg: #9ef0f0;
  --success: #42be65; --error: #fa4d56; --warning: #f1c21b; --warning-text: #f1c21b; --info: #4589ff;
  --notice-warn-bg: #393939; --toast-bg: #f4f4f4; --toast-fg: #161616;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 20px; letter-spacing: .16px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--shell); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button, select, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.muted { color: var(--muted); }

/* shell header */
.shell { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--shell); color: var(--shell-fg); border-bottom: 1px solid var(--shell-line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.shell-name { font-size: 14px; letter-spacing: .1px; white-space: nowrap; }
.shell-name b { font-weight: 600; }
.shell-sep { width: 1px; height: 24px; background: var(--shell-line); }
.shell-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
.shell-crumb { font-size: 14px; color: var(--shell-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--shell-muted); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #42be65; flex: none; }
.dot.paused { background: #f1c21b; }

.app { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: calc(100vh - 48px); }
.side { position: sticky; top: calc(48px + env(safe-area-inset-top, 0px)); height: calc(100vh - 48px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); background: var(--nav-bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-block: 16px 0; padding-left: env(safe-area-inset-left, 0px); overflow-y: auto; }
nav { display: flex; flex-direction: column; }
.nav-group { font-size: 12px; letter-spacing: .32px; color: var(--placeholder); padding: 16px 16px 6px; }
.nav-group:first-child { padding-top: 0; }
nav a { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; padding: 0 16px; color: var(--muted); font-weight: 600; font-size: 14px; }
nav a:hover { background: var(--hover); color: var(--fg); text-decoration: none; }
nav a.active { background: var(--nav-selected); color: var(--fg); }
nav a.active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--interactive); }
.count { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--error); color: #ffffff; text-align: center; line-height: 18px; font-weight: 400; }
.count:empty { display: none; }
.side-foot { margin-top: auto; padding: 16px; border-top: 1px solid var(--line); font-size: 12px; letter-spacing: .32px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

main { min-width: 0; padding-block: 32px 80px; padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1184px; display: flex; flex-direction: column; gap: 24px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.eyebrow { font-size: 12px; letter-spacing: .32px; color: var(--muted); }
h1 { font-weight: 400; font-size: 32px; line-height: 40px; letter-spacing: 0; margin: 4px 0 0; text-wrap: balance; }
h2 { font-weight: 400; font-size: 20px; line-height: 28px; letter-spacing: 0; margin: 0; text-wrap: balance; }
h3 { font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: 0; margin: 0; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 68ch; margin-top: 8px; font-size: 16px; line-height: 24px; letter-spacing: 0; }

.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 1px solid var(--interactive); background: transparent; color: var(--link); border-radius: 0; cursor: pointer; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--interactive); color: var(--on-interactive); text-decoration: none; }
.btn.primary { background: var(--interactive); border-color: var(--interactive); color: var(--on-interactive); padding-right: 32px; }
.btn.primary:hover { background: var(--interactive-hover); border-color: var(--interactive-hover); }
.btn.ghost { border-color: transparent; color: var(--link); }
.btn.ghost:hover { background: var(--hover); color: var(--link); }
.btn.danger { border-color: var(--error); color: var(--error); }
.btn.danger:hover { background: var(--error); color: #ffffff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.spread { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }

.panel { background: var(--layer); padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }

.mode, .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 24px; font-size: 12px; letter-spacing: .32px; white-space: nowrap; }
.mode.Silent, .pill.waiting { background: var(--t-gray-bg); color: var(--t-gray-fg); }
.mode.Report, .pill.progress { background: var(--t-blue-bg); color: var(--t-blue-fg); }
.mode.Ask, .pill.needs { background: var(--t-orange-bg); color: var(--t-orange-fg); }
.mode.Handoff { background: var(--t-red-bg); color: var(--t-red-fg); }
.pill.scheduled { background: var(--t-teal-bg); color: var(--t-teal-fg); }
.pill.done { background: var(--t-green-bg); color: var(--t-green-fg); }
.proj { font-size: 12px; letter-spacing: .32px; color: var(--muted); }
.tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0; padding: 2px 8px; background: var(--layer2); white-space: nowrap; }

.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: var(--notice-warn-bg); color: var(--fg); border-left: 3px solid var(--warning); padding: 12px 16px; }
.strip { display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 12px 16px; background: var(--layer); font-size: 14px; }
.strip b { font-weight: 600; }

.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.item.wide { grid-template-columns: auto minmax(0, 1fr) auto; }
.item:first-child { border-top: 0; padding-top: 0; }
.rank { font-family: var(--font-mono); color: var(--muted); font-size: 14px; letter-spacing: 0; }
.item-title { font-weight: 600; }
.item-title a { color: var(--fg); }
.item-meta { font-size: 14px; color: var(--muted); margin-top: 2px; }

.clock { display: grid; grid-template-columns: minmax(0, 1fr) 160px 56px; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); color: var(--fg); }
.clock:first-of-type { border-top: 0; }
.clock:hover { text-decoration: none; }
.clock:hover .clock-name { text-decoration: underline; }
.clock-name { font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { position: relative; height: 8px; background: var(--track); overflow: hidden; }
.bar > span { position: absolute; inset: 0 auto 0 0; background: var(--interactive); }
.bar.warn > span { background: var(--warning); } .bar.crit > span { background: var(--error); }
.bar i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--layer); }
.age { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0; text-align: right; }
.age.crit { color: var(--error); font-weight: 600; } .age.warn { color: var(--warning-text); font-weight: 600; }

.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); }
.stat { background: var(--layer2); padding: 12px 16px; }
.stat b { display: block; font-size: 28px; line-height: 36px; font-weight: 300; }
.stat span { font-size: 12px; letter-spacing: .32px; color: var(--muted); }

.board-wrap { overflow-x: auto; padding-bottom: 8px; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 16px; min-width: min-content; }
.col { background: var(--layer); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 240px; }
.col-head { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 8px; font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.card { display: flex; flex-direction: column; gap: 8px; background: var(--layer2); border: 1px solid transparent; padding: 12px 16px; color: var(--fg); }
.card:hover { background: var(--hover); text-decoration: none; }
.card:focus-visible { outline-offset: -2px; }
.card-title { font-size: 14px; line-height: 20px; }
.card .next { font-size: 12px; letter-spacing: .32px; color: var(--muted); }
.empty { font-size: 12px; color: var(--muted); padding: 8px 4px; }

.chips { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line-strong); }
.chip { border: 0; border-right: 1px solid var(--line-strong); background: transparent; padding: 0 16px; height: 40px; cursor: pointer; font-size: 14px; color: var(--muted); }
.chip:last-child { border-right: 0; }
.chip:hover { background: var(--hover); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.detail { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.thread { display: flex; flex-direction: column; }
.ev { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.ev:first-child { border-top: 0; }
.ev-time { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0; color: var(--muted); padding-top: 1px; }
.ev-who { font-size: 12px; font-weight: 600; letter-spacing: .32px; }
.ev-who.agent { color: var(--link); } .ev-who.you { color: var(--fg); } .ev-who.system { color: var(--muted); } .ev-who.caller { color: var(--t-orange-fg); }
.ev-text { margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.composer { display: flex; gap: 0; align-items: stretch; border-top: 1px solid var(--line); padding-top: 16px; }
.composer textarea { flex: 1; min-width: 0; resize: vertical; min-height: 40px; border: 0; border-bottom: 1px solid var(--line-strong); background: var(--layer2); padding: 10px 16px; border-radius: 0; }
.composer textarea::placeholder, input::placeholder, textarea::placeholder { color: var(--placeholder); }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 12px; font-size: 14px; }
.kv dt { color: var(--muted); font-size: 12px; letter-spacing: .32px; padding-top: 1px; } .kv dd { margin: 0; overflow-wrap: anywhere; }
dl { margin: 0; }
.facts { display: flex; flex-direction: column; gap: 8px; }
.fact { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.fact-mark { width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #ffffff; }
.fact-mark.pass { background: var(--success); } .fact-mark.fail { background: var(--error); } .fact-mark.unknown { background: var(--line-strong); }
.fact small { display: block; color: var(--muted); font-size: 12px; letter-spacing: .32px; }
.summary { background: var(--layer2); padding: 12px 16px; font-size: 14px; }
.prec { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }

.approval { background: var(--layer); border-left: 3px solid var(--t-orange-fg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.approval.edited { border-left-color: var(--info); }
.panel .approval { background: var(--layer2); }
.draft { background: var(--layer2); border-bottom: 1px solid var(--line-strong); padding: 12px 16px; white-space: pre-wrap; font-size: 14px; overflow-wrap: anywhere; max-height: 300px; overflow-y: auto; }
.panel .approval .draft { background: var(--layer); }
.draft-edit { width: 100%; min-height: 200px; border: 0; border-bottom: 1px solid var(--line-strong); outline: 2px solid var(--focus); outline-offset: -2px; background: var(--layer2); padding: 12px 16px; font-size: 14px; resize: vertical; border-radius: 0; }
.note { font-size: 12px; letter-spacing: .32px; color: var(--muted); }
.note.warn { color: var(--warning-text); font-weight: 600; }

.table-wrap { overflow-x: auto; background: var(--layer); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 14px; font-weight: 600; color: var(--fg); padding: 0 16px; height: 48px; background: var(--accent-layer); white-space: nowrap; }
td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
.panel .table-wrap { background: var(--layer2); }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--hover); }
td.nowrap { white-space: nowrap; }
tr.struck td { color: var(--muted); text-decoration: line-through; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; }
.linkbtn:hover { text-decoration: underline; }

.workers { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px; background: var(--line); }
.worker { padding: 12px 16px; background: var(--layer2); font-size: 14px; display: flex; flex-direction: column; gap: 4px; border-top: 3px solid transparent; }
.worker b { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0; font-weight: 400; color: var(--muted); }
.worker.busy { border-top-color: var(--interactive); }

.form { display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 16px 24px; align-items: start; }
.form > label { font-size: 12px; letter-spacing: .32px; color: var(--muted); padding-top: 10px; }
.form > label small { display: block; color: var(--placeholder); font-size: 12px; }
.field, .form select, .form input[type="text"], .form input[type="number"], .form input[type="time"], .form textarea { width: 100%; min-height: 40px; border: 0; border-bottom: 1px solid var(--line-strong); border-radius: 0; background: var(--layer2); padding: 8px 16px; }
.form textarea { min-height: 120px; resize: vertical; }
select.field { padding-right: 32px; }
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 1px; background: var(--line); }
.tool { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--layer2); }
.tool label { display: flex; align-items: center; gap: 8px; padding: 0; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0; color: var(--fg); cursor: pointer; }
input[type="checkbox"] { accent-color: var(--fg); width: 16px; height: 16px; }
.yaml { font-family: var(--font-mono); font-size: 12px; line-height: 18px; letter-spacing: 0; background: var(--layer2); padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.editor { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.sticky { position: sticky; top: calc(48px + env(safe-area-inset-top, 0px) + 16px); }

.tabs { display: flex; overflow-x: auto; }
.tab { border: 0; border-bottom: 2px solid var(--line); background: none; padding: 11px 16px; cursor: pointer; font-size: 14px; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--fg); border-bottom-color: var(--line-strong); }
.tab[aria-selected="true"] { color: var(--fg); font-weight: 600; border-bottom-color: var(--interactive); }
.memo { white-space: pre-wrap; font-size: 14px; background: var(--layer2); padding: 12px 16px; }
.conn { display: flex; flex-direction: column; gap: 12px; }
.conn ul { margin: 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.st { font-size: 12px; letter-spacing: .32px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.st.ok { color: var(--success); } .st.part { color: var(--info); } .st.pend { color: var(--warning-text); } .st.no { color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--t-red-bg); color: var(--t-red-fg); border-left: 3px solid var(--error); padding: 12px 16px; }

function yamlOf(r) {

  return `name: ${r.slug || 'new-recipe'}\nproject: ${r.project}\ntrigger: "${r.trigger}"\nmodel: ${r.model.toLowerCase()}\nstatus: ${r.status.toLowerCase()}\ntools:\n${r.tools.map(t => `  - ${t}   # ${toolMode(t)}`).join('\n') || '  []'}\ninstructions: >\n${lines.map(l => '  ' + l).join('\n')}\noutput: ${r.output}`;
}

Supports Doxis (RDDMS) incidents and Power BI reports for the client
Working hours 09:00–18:30 IST, Mon–Fri

    <section class="panel"><div class="panel-head"><h2>preferences.md</h2><span class="note">Loaded on every run</span></div><div class="memo">Keep caller messages short; offer a with-steps version

  if (tab === 'lessons') body = `<section class="panel"><div class="panel-head"><h2>Proposed from your corrections</h2><span class="note">Saved only when you approve</span></div>
    <div class="list">${S.lessons.filter(l => l.state === 'proposed').map(l => `<div class="item"><span class="rank">→</span><div><div class="item-title">${esc(l.text)}</div><div class="item-meta">${esc(l.from)}</div></div><div class="row"><button class="btn" data-action="lesson" data-id="${l.id}" data-v="approved">Save rule</button><button class="btn ghost" data-action="lesson" data-id="${l.id}" data-v="discarded">Discard</button></div></div>`).join('') || '<p class="muted">No proposals right now.</p>'}</div></section>

  if (tab === 'sources') body = `<section class="panel"><div class="panel-head"><h2>Searchable reference material</h2><span class="note">Full-text search in SQLite; no embeddings needed</span></div>
    <div class="table-wrap"><table><thead><tr><th>Source</th><th>Items</th><th>Last indexed</th><th></th></tr></thead><tbody>
    ${[['Doxis incident workbook (L2 history)', '408 tickets', '21 Oct'], ['Closed tickets saved as precedents', '37 tickets', 'Today 02:10'], ['Validated rights matrix', '612 rows', '15 Jul'], ['D2 roles specification', '48 pages', '15 Jul'], ['KB articles KB01–KB04', '4 articles', '18 Oct'], ['Site access request guide', '6 pages', '02 Oct']].map((s, i) => `<tr><td>${s[0]}</td><td class="mono">${s[1]}</td><td class="nowrap" id="idx-${i}">${s[2]}</td><td><button class="linkbtn" data-action="reindex" data-i="${i}">Re-index</button></td></tr>`).join('')}
    </tbody></table></div></section>`;
  if (tab === 'tasks') body = `<section class="panel"><h2>How each task remembers</h2><p class="muted">Every task has four parts. Each run loads the first two and the last few events, then asks for more only when a step needs it.</p>
    <div class="grid2"><div class="summary"><b>Task card</b><br>Structured fields: state, people, site, checks, next action, deadline. Always loaded.</div><div class="summary"><b>Running summary</b><br>What has happened so far, rewritten after each update to a fixed length. Always loaded.</div><div class="summary"><b>Event log</b><br>Every email, message, action and approval with source links. Only the last few are loaded.</div><div class="summary"><b>Attachments</b><br>Screenshot text, drafts, files. Loaded only on request. Raw text expires after 14 days.</div></div>
    <p class="note">Names are replaced with tokens before any model call. The token map stays on this laptop.</p></section>`;
  return `<div class="page">
    <div class="page-head"><div><div class="eyebrow">Stored on this laptop</div><h1>Memory</h1><p class="lede">The agent rebuilds a small context for every run from what is stored here, instead of carrying a long conversation. Everything links back to its source.</p></div></div>
    <div class="tabs" role="tablist">${tabs.map(t => `<button class="tab" role="tab" aria-selected="${tab === t[0]}" data-action="mem-tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>

}

function pagePrefs() {
  const policy = [['Read mail, chats, reports and files', 'Silent'], ['File or flag your own mail', 'Report'], ['Save a draft', 'Report'], ['Add a task or a hold on your own calendar', 'Report'], ['Retry your own failed refresh (known transient error)', 'Report'], ['Send an email or chat message', 'Ask'], ['Trigger a Prod refresh', 'Ask'], ['Edit a shared list or document', 'Ask'], ['Change a ServiceNow ticket state', 'Hand off'], ['Delete anything', 'Hand off'], ['Message anyone outside the company', 'Hand off'], ['Grant access', 'Hand off']];
  return `<div class="page" style="max-width:980px">

    <div class="page-head"><div><div class="eyebrow">How the agent behaves</div><h1>Settings</h1></div></div>
    <section class="panel"><h2>Schedule</h2><div class="form">
      <label for="p-hours">Working hours</label><div class="row"><input id="p-hours" type="time" value="09:00" style="width:auto"> to <input id="p-hours-end" type="time" value="18:30" style="width:auto" aria-label="End of working hours"></div>
      <label for="p-brief">Morning brief</label><input id="p-brief" type="time" value="09:00" style="width:auto">

      <label>Use Sonnet for<small>Off unless ticked</small></label><div style="display:flex;flex-direction:column;gap:6px"><label class="switch"><input type="checkbox" id="s1" checked> Caller-facing drafts</label><label class="switch"><input type="checkbox" id="s2" checked> Meeting transcripts over 30 min</label><label class="switch"><input type="checkbox" id="s3"> Weekly reports</label></div>
      <label for="p-budget">Daily Sonnet limit</label><div class="row"><input id="p-budget" type="number" value="40" style="width:90px"> <span class="muted">runs a day, then Haiku only</span></div>
    </div></section>

      <p class="note">After you approve the same kind of action unchanged several times, the agent suggests moving it to Report. You decide.</p></section>
    <section class="panel"><h2>Stop or start over</h2>
      <div class="row"><button class="btn" data-action="toggle-pause">${S.paused ? 'Resume agent' : 'Pause agent'}</button><button class="btn danger" data-action="reset-ask">Reset memory and tasks</button></div>
      ${S.resetAsk ? `<div class="confirm"><span>This deletes all task memory, lessons and schedules on this laptop. The audit log is kept.</span><button class="btn danger" data-action="reset-do">Delete and reset</button><button class="btn ghost" data-action="reset-cancel">Cancel</button></div>` : ''}

function notFound() { return `<div class="page"><h1>Page not found</h1><p><a href="#brief">Go to the morning brief</a></p></div>`; }

/* ---------- router ---------- */
function render() {
  const h = (location.hash || '#brief').slice(1);
  let route = h, html;
  if (h === 'brief' || h === '') html = pageBrief();
  else if (h === 'tasks') html = pageTasks();
  else if (h.startsWith('task-')) { const t = S.tasks.find(x => x.id.toLowerCase() === h.slice(5)); html = t ? pageTask(t) : notFound(); route = 'tasks'; }
  else if (h === 'approvals') html = pageApprovals();
  else if (h === 'recipes') html = pageRecipes();
  else if (h.startsWith('recipe-')) { html = pageRecipe(h.slice(7)); route = 'recipes'; }
  else if (h === 'activity') html = pageActivity();
  else if (h === 'memory') html = pageMemory();
  else if (h === 'connectors') html = pageConnectors();
  else if (h === 'prefs') html = pagePrefs();
  else html = notFound();
  document.getElementById('main').innerHTML = html;
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.route === (route || 'brief')));
  updateChrome();
}
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
window.addEventListener('hashchange', () => { S.editing = null; S.resetAsk = false; render(); window.scrollTo(0, 0); });

/* ---------- actions ---------- */
function approve(id) {
  const a = S.approvals.find(x => x.id === id); if (!a) return;
  if (S.paused) { toast('The agent is paused. Resume it to send approved actions.'); return; }
  S.approvals = S.approvals.filter(x => x.id !== id);
  const t = task(a.task);
  if (a.kind === 'Power BI refresh') {
    t.state = 'progress'; t.next = 'Refreshing: dataflow, then dataset';
    addEvent(t, 'you', 'You', 'Approved the refresh plan.');
    log(t.id, 'Started dataflow refresh for Global Cockpit (you approved)', 'trigger_refresh', 'Ask', 'Running');
    toast('Refresh started. The agent will reply to Priya when it finishes.');
    setTimeout(() => { t.state = 'done'; t.next = 'Refreshed at ' + now(); addEvent(t, 'agent', 'Agent', 'Dataflow and dataset refreshed. Posted the approved reply to Priya: "Refreshed at ' + now() + ' IST; source data up to 08:20."'); log(t.id, 'Posted the approved reply to Priya', 'post_chat', 'Ask', 'Sent'); rerender(); toast('Global Cockpit refreshed. Priya has her reply.'); }, 3500);
  } else {
    const waitingNext = { a1: 'Waiting for Tomás to raise the site request', a2: 'Escalated to Doxis L2; waiting on them', a3: 'Reminder sent; waiting on Sophie', a5: 'Acknowledged; estimate due Friday' };
    t.state = 'waiting'; t.next = waitingNext[id] || 'Sent; waiting';
    addEvent(t, 'you', 'You', (a.edited ? 'Approved your edited text. ' : 'Approved. ') + 'Sent the ' + a.kind.toLowerCase() + ' to ' + a.to + '.');
    log(t.id, 'Sent the ' + a.kind.toLowerCase() + ' to ' + a.to + ' (you approved)', a.kind.startsWith('Email') ? 'send_mail' : 'post_chat', 'Ask', 'Sent');
    toast('Sent to ' + a.to + '.');
  }
  rerender();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el || el.tagName === 'SELECT') return;
  const act = el.dataset.action, id = el.dataset.id;
  if (act === 'toggle-pause') { S.paused = !S.paused; log('Agent', S.paused ? 'Paused all schedules and pending actions' : 'Resumed', '—', 'Silent', 'Done'); toast(S.paused ? 'Paused. Nothing will run until you resume.' : 'Resumed. Next check-in at 11:00.'); rerender(); }
  if (act === 'checkin') { if (S.paused) { toast('Resume the agent to run a check-in.'); return; } log('Check-in', 'Polled Outlook, Teams and Power BI on request', 'read_mail, read_chat', 'Silent', '1 new item'); toast('Check-in done: 1 new item. Elena\'s reply was already picked up.'); rerender(); }
  if (act === 'prep') toast('Prep brief: 7 open Doxis tickets, 2 rendition issues this week (possible platform issue), 1 waiting on L2.');
  if (act === 'filter-project') { S.projectFilter = el.dataset.v; rerender(); }
  if (act === 'filter-mode') { S.modeFilter = el.dataset.v; rerender(); }
  if (act === 'approve') approve(id);
  if (act === 'reject') { const a = S.approvals.find(x => x.id === id); S.approvals = S.approvals.filter(x => x.id !== id); const t = task(a.task); t.next = 'You rejected the draft; tell the agent what to change'; addEvent(t, 'you', 'You', 'Rejected the drafted ' + a.kind.toLowerCase() + '.'); log(t.id, 'Draft rejected by you', 'save_draft', 'Ask', 'Not sent'); toast('Rejected. Nothing was sent.'); rerender(); }
  if (act === 'edit') { S.editing = id; rerender(); const ta = document.getElementById('edit-' + id); if (ta) ta.focus(); }
  if (act === 'cancel-edit') { S.editing = null; rerender(); }
  if (act === 'save-edit') { const a = S.approvals.find(x => x.id === id); const ta = document.getElementById('edit-' + id); if (a && ta && ta.value.trim() !== a.text.trim()) { a.text = ta.value; a.edited = true; toast('Edit saved. Approve the edited text to send it.'); } S.editing = null; rerender(); }
  if (act === 'undo') { const a = S.activity[+el.dataset.i]; if (a) { a.undone = true; log(a.ref, 'Undid: ' + a.action, a.tool, 'Report', 'Reverted'); toast('Undone.'); rerender(); } }
  if (act === 'mark-done') { const t = task(id); t.state = 'done'; t.next = 'Closed by you at ' + now(); if (t.approval) S.approvals = S.approvals.filter(a => a.id !== t.approval); addEvent(t, 'you', 'You', 'Marked this task done. It will be saved as a precedent tonight.'); log(t.id, 'Task closed by you', 'update_ledger', 'Report', 'Done'); toast(t.id + ' marked done.'); rerender(); }
  if (act === 'send-msg') {
    const ta = document.getElementById('msg'); const text = ta.value.trim(); if (!text) { ta.focus(); return; }
    const t = task(id); addEvent(t, 'you', 'You', text); rerender();
    const th = document.getElementById('thread'); th.insertAdjacentHTML('beforeend', '<div class="ev"><span class="ev-time"></span><div class="typing">Agent is working on it…</div></div>');
    setTimeout(() => {
      const l = text.toLowerCase(); let reply;
      if (l.includes('short')) reply = 'Made a shorter version and replaced the draft. It still needs your approval.';
      else if (l.includes('access') || l.includes('check')) reply = 'Ran the access checks again for the affected person. No change: not a member of the leading site. Source: validated rights matrix.';
      else if (l.includes('escalat') || l.includes('l2')) reply = 'Drafted an L2 package with the checks so far. It is waiting for your approval.';
      else if (l.includes('summar')) reply = t.summary;
      else reply = 'Noted on this task. I will use it on the next run and post here when something changes.';
      addEvent(t, 'agent', 'Agent', reply); log(t.id, 'Answered your message in the task thread', 'update_ledger', 'Silent', 'Done'); rerender();
    }, 900);
  }
  if (act === 'mem-tab') { S.memTab = el.dataset.v; rerender(); }
  if (act === 'lesson') { const l = S.lessons.find(x => x.id === id); l.state = el.dataset.v; if (el.dataset.v === 'approved') l.from = 'Approved today'; toast(el.dataset.v === 'approved' ? 'Rule saved. It applies from the next run.' : 'Discarded.'); rerender(); }
  if (act === 'reindex') { const c = document.getElementById('idx-' + el.dataset.i); if (c) c.textContent = 'Today ' + now(); toast('Re-indexed.'); }
  if (act === 'reset-ask') { S.resetAsk = true; rerender(); }
  if (act === 'reset-cancel') { S.resetAsk = false; rerender(); }
  if (act === 'reset-do') { S.resetAsk = false; toast('This is a prototype, so nothing was deleted. In the app, memory and tasks would now be empty.'); rerender(); }
  if (act === 'test-recipe') {
    const box = document.getElementById('testOut'), body = document.getElementById('testBody'); if (!box || !draft) return; box.hidden = false;
    const acts = draft.tools.map(t => `<div class="row" style="justify-content:space-between"><span class="mono" style="font-size:12px">${t}</span>${modeBadge(toolMode(t))}</div>`).join('');
    body.innerHTML = `<p class="muted" style="font-size:13px">Sample: INC30099999 "Cannot open project folder" (made-up ticket). Model: ${esc(draft.model)}.</p><div style="display:flex;flex-direction:column;gap:6px">${acts || '<span class="muted">No tools selected.</span>'}</div><p class="note">Shadow test: anything in Ask mode was drafted, not sent. ${draft.tools.some(t => toolMode(t) === 'Ask') ? 'You would get an approval card.' : 'No approval needed.'}</p>`;
  }
  if (act === 'save-recipe') {
    if (!draft.name.trim()) { toast('Give the recipe a name first.'); document.getElementById('f-name').focus(); return; }
    const existing = S.recipes.find(r => r.slug === draft.slug && draft.slug);
    if (existing) { Object.assign(existing, draft); toast('Saved. Changes apply from the next run.'); }
    else { draft.slug = draft.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'new-recipe'; draft.status = 'Shadow'; S.recipes.push(draft); toast('Saved in Shadow mode. Switch it to Live on the recipes page when it looks right.'); }
    location.hash = '#recipes';
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.action === 'recipe-status') { const r = S.recipes.find(x => x.slug === el.dataset.slug); r.status = el.value; log(r.name, 'Status changed to ' + el.value, '—', 'Silent', 'Done'); toast(r.name + ' is now ' + el.value + '.'); }
});
document.addEventListener('input', e => {
  const el = e.target; if (!draft || !document.getElementById('yaml')) return;
  if (el.dataset.field) draft[el.dataset.field] = el.value;
  if (el.dataset.tool) { draft.tools = [...document.querySelectorAll('[data-tool]:checked')].map(x => x.dataset.tool); }
  if (el.dataset.field === 'name' && !S.recipes.some(r => r.slug === draft.slug && draft.slug)) draft.slug = el.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  document.getElementById('yaml').textContent = yamlOf(draft);
});

render();
})();
</script>
