[project]
name = "always-on-agent"
version = "0.1.0"
description = "Personal always-on work agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph==1.2.15",
    "langgraph-checkpoint-sqlite==3.1.2",
    "apscheduler==3.11.3",
    "sqlalchemy[asyncio]==2.1.4",
    "aiosqlite==0.22.1",
    "cryptography==50.0.2",
    "alembic==1.20.0",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "msal==1.39.0",
    "msal-extensions==1.3.1",
    "httpx==0.28.1",
    "pywin32==312; sys_platform == 'win32'",
    "slack-bolt==1.30.0",
    "winrt-runtime==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage==3.2.1; sys_platform == 'win32'",
    "keyring==25.7.0",
    "pydantic==2.14.1",
    "typer==0.27.3",
    "pyyaml==6.0.3",
    "tzdata==2026.5",
    "jinja2==3.1.6",
]

[dependency-groups]
dev = ["pillow==12.3.0", "openpyxl==3.1.5", "pytest==9.1.1", "pytest-asyncio==1.4.0", "hypothesis==6.169.0", "respx==0.23.1", "ruff==0.17.0", "mypy==2.4.0", "types-pyyaml==6.0.12.20260906"]

[project.scripts]
agentd = "agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.uv]
exclude-newer = "2026-10-14T00:00:00Z"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_fixtures.py" = ["E501"]  # fixture data reads better unwrapped

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/agent"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["msal", "msal_extensions", "win32com", "win32com.*", "pythoncom", "pywintypes"]
ignore_missing_imports = true
