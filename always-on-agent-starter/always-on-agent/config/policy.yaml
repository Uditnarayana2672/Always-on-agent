# Tool -> mode. Modes: silent | report | ask | hand_off.
# Hand off entries are locked and cannot be changed from the console.
tools:
  read_mail: { mode: silent }
  search_mail: { mode: silent }
  read_report_email: { mode: silent }
  read_chat: { mode: silent }
  read_calendar: { mode: silent }
  get_transcript: { mode: silent }
  search_workbook: { mode: silent }
  search_memory: { mode: silent }
  ocr_local: { mode: silent }
  read_directory: { mode: silent }
  get_refresh_history: { mode: silent }
  read_sharepoint_list: { mode: silent }
  sql_count: { mode: silent }
  read_brief_data: { mode: silent }        # recipe views (R01-R06): read-only
  read_digest_data: { mode: silent }
  read_mentions: { mode: silent }
  read_refresh_facts: { mode: silent }
  read_mail_rules: { mode: silent }
  read_reply_context: { mode: silent }
  find_known_fix: { mode: silent }
  publish_brief: { mode: silent }          # to you only (Slack DM, console)
  publish_digest: { mode: silent }
  notify_me: { mode: silent }
  move_mail: { mode: report }
  flag_mail: { mode: report }
  categorise: { mode: report }
  save_draft: { mode: report }
  update_ledger: { mode: report }
  add_hold: { mode: report }
  set_flag: { mode: report }               # undo of flag_mail
  discard_own_draft: { mode: report }      # undo of save_draft: only unsent drafts the agent made
  discard_own_hold: { mode: report }
  open_reply_task: { mode: report }        # R02: a reply task for a mail that needs an answer       # undo of add_hold: only agent holds nobody was invited to
  update_directory: { mode: report }
  write_memory: { mode: report }
  send_mail: { mode: ask }
  post_chat: { mode: ask }
  trigger_refresh: { mode: ask }
  trigger_dataflow_refresh: { mode: ask }
  update_refresh_schedule: { mode: ask }
  edit_shared_list: { mode: ask }
  add_comment_by_reply: { mode: ask }
  delete_item: { mode: hand_off, locked: true }
  change_ticket_state: { mode: hand_off, locked: true }
  grant_access: { mode: hand_off, locked: true }
  message_outside_company: { mode: hand_off, locked: true }
  enter_credentials: { mode: hand_off, locked: true }
